<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jerson Huamani | Digital Business Card</title>
  <meta
    name="description"
    content="Digital business card for Jerson Huamani, Director at JALIMCORP."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --bg: #050505;
      --panel: #0d0d0d;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.16);
      --line-strong: rgba(255, 255, 255, 0.3);
      --card-width: 30rem;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 28%),
        linear-gradient(180deg, #111111 0%, #040404 100%);
      color: var(--text);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 1rem;
    }

    .shell {
      width: 100%;
      max-width: calc(var(--card-width) + 2rem);
      display: flex;
      align-items: center;
    }

    .card {
      width: min(100%, var(--card-width));
      margin: 0 auto;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01)),
        var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .section {
      padding: 1.5rem;
    }

    .section-lg {
      padding: 2rem 1.5rem;
    }

    .top {
      padding-top: 2.25rem;
      padding-bottom: 1.5rem;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent),
        #030303;
    }

    .name {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(2.1rem, 8vw, 3.45rem);
      line-height: 0.96;
      letter-spacing: 0.02em;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
      margin-top: 1.35rem;
    }

    .role {
      margin: 0;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .contact-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.9rem;
      flex-wrap: wrap;
    }

    .contact-link {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
      text-decoration: none;
    }

    .contact-link:hover,
    .contact-link:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
      outline: none;
    }

    .contact-link svg {
      width: 1.35rem;
      height: 1.35rem;
      fill: currentColor;
    }

    .image-wrap {
      display: flex;
      justify-content: center;
    }

    .portrait {
      width: 100%;
      max-width: 18rem;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      filter: grayscale(100%);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.32);
      background: #111111;
    }

    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      padding-top: 0.5rem;
    }

    .logo {
      max-width: 10rem;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: grayscale(100%) brightness(1.15);
      opacity: 0.95;
    }

    .footer {
      padding-top: 0.75rem;
      padding-bottom: 1.75rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.48);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Save Contact button ── */
    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.9rem 1.25rem;
      margin-bottom: 1.25rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 0.85rem;
      color: var(--text);
      font-family: "Manrope", sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, transform 150ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .save-btn:hover,
    .save-btn:focus-visible {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
      outline: none;
    }

    .save-btn:active {
      transform: translateY(0);
    }

    .save-btn svg {
      width: 1.1rem;
      height: 1.1rem;
      fill: currentColor;
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      body {
        padding: 2rem;
      }

      .section,
      .section-lg {
        padding-left: 2rem;
        padding-right: 2rem;
      }

      .top {
        padding-top: 2.75rem;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <article class="card" aria-label="Digital business card">
      <section class="section top">
        <h1 class="name">Jerson Huamani</h1>
        <div class="divider" aria-hidden="true"></div>
      </section>

      <section class="section" aria-labelledby="role-title">
        <p class="role" id="role-title">Director</p>
        <div class="divider" aria-hidden="true"></div>
      </section>

      <section class="section" aria-labelledby="contact-title">
        <span class="sr-only" id="contact-title">Contact links</span>

        <!-- ── Save Contact button — replace placeholders before deploying ── -->
        <!-- Replace [EMPLOYEE_FULL_NAME] in the aria-label below -->
        <button
          type="button"
          class="save-btn"
          onclick="downloadVCard()"
          aria-label="Save [EMPLOYEE_FULL_NAME] as a contact"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16L6.5 10.5L7.9 9.1L11 12.2V3H13V12.2L16.1 9.1L17.5 10.5L12 16ZM4 21V19H20V21H4Z"/>
          </svg>
          Save Contact
        </button>

        <div class="contact-grid">
          <!-- Replace [EMAIL_ADDRESS] with the real email address -->
          <a
            class="contact-link"
            href="mailto:jerson.huamani@jalimcorp.com"
            aria-label="Send email"
            title="Email"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.25 6.75A2.25 2.25 0 0 1 4.5 4.5h15A2.25 2.25 0 0 1 21.75 6.75v10.5A2.25 2.25 0 0 1 19.5 19.5h-15a2.25 2.25 0 0 1-2.25-2.25V6.75Zm1.73-.35 7.33 5.44a1.2 1.2 0 0 0 1.38 0l7.33-5.44H3.98Zm16.27 1.82-6.66 4.94a2.7 2.7 0 0 1-3.18 0L3.75 8.22v9.03c0 .41.34.75.75.75h15c.41 0 .75-.34.75-.75V8.22Z"/>
            </svg>
          </a>

          <!-- Replace [WHATSAPP_NUMBER_IN_INTERNATIONAL_FORMAT] with digits only, for example 260971234567 -->
          <a
            class="contact-link"
            href="https://wa.me/260961959501"
            target="_blank"
            rel="noreferrer"
            aria-label="Open WhatsApp"
            title="WhatsApp"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12.04 2.25c-5.38 0-9.74 4.24-9.74 9.48 0 1.68.45 3.33 1.32 4.78L2.25 21.75l5.42-1.41a9.88 9.88 0 0 0 4.37 1.01h.01c5.38 0 9.71-4.24 9.71-9.49 0-2.54-1.01-4.93-2.83-6.72a9.83 9.83 0 0 0-6.89-2.89Zm0 17.51h-.01a8.18 8.18 0 0 1-4.16-1.13l-.3-.18-3.22.84.86-3.1-.2-.32a7.87 7.87 0 0 1-1.22-4.14c0-4.35 3.7-7.9 8.25-7.9 2.2 0 4.26.84 5.81 2.37a7.8 7.8 0 0 1 2.39 5.53c0 4.36-3.67 7.93-8.2 7.93Zm4.52-5.96c-.25-.12-1.47-.72-1.7-.8-.23-.08-.39-.12-.56.12-.16.24-.65.8-.79.96-.15.16-.29.18-.54.06-.25-.12-1.05-.38-2-1.22-.74-.66-1.24-1.47-1.38-1.71-.14-.24-.02-.37.1-.49.11-.1.25-.26.37-.39.12-.14.16-.24.25-.4.08-.16.04-.3-.02-.42-.06-.12-.56-1.32-.77-1.8-.2-.48-.41-.41-.56-.42h-.48c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 1.99 0 1.17.87 2.3.99 2.46.12.16 1.7 2.68 4.2 3.65.59.25 1.05.39 1.41.5.59.19 1.12.16 1.54.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.1-.22-.16-.47-.28Z"/>
            </svg>
          </a>

          <!-- Replace [LINKEDIN_PROFILE_URL] with the full LinkedIn profile URL -->
          <a
            class="contact-link"
            href="https://www.linkedin.com/in/jerson-huamani-rojas-0a819237/"
            target="_blank"
            rel="noreferrer"
            aria-label="Open LinkedIn profile"
            title="LinkedIn"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.94 8.25A1.69 1.69 0 1 0 6.94 4.88a1.69 1.69 0 0 0 0 3.37ZM5.44 9.56h3v9.94h-3V9.56Zm4.88 0h2.87v1.36h.04c.4-.75 1.38-1.55 2.84-1.55 3.04 0 3.61 1.89 3.61 4.35v5.78h-3v-5.12c0-1.22-.02-2.78-1.8-2.78-1.8 0-2.07 1.33-2.07 2.69v5.21h-3V9.56Z"/>
            </svg>
          </a>
        </div>
        <div class="divider" aria-hidden="true"></div>
      </section>

      <section class="section-lg image-wrap">
        <!-- Replace [PORTRAIT_IMAGE_URL] with the portrait image URL -->
        <img
          class="portrait"
          src="[PORTRAIT_IMAGE_URL]"
          alt="Portrait of Jerson Huamani"
        >
      </section>

      <section class="section logo-section">
        <!-- Replace [COMPANY_LOGO_URL] with the JALIMCORP logo URL -->
        <img
          class="logo"
          src="[COMPANY_LOGO_URL]"
          alt="JALIMCORP logo"
        >
      </section>

      <footer class="footer">JALIMCORP</footer>
    </article>
  </main>

  <script>
    /* ── Save Contact — vCard download ──────────────────────────────────────
       Replace each placeholder with the employee's real data before deploying:
         [EMPLOYEE_FULL_NAME]  — e.g. Jane Smith
         [COMPANY_NAME]        — e.g. JALIMCORP
         [PHONE_NUMBER]        — e.g. +260971234567  (include country code)
         [EMAIL_ADDRESS]       — e.g. jane.smith@jalimcorp.com
         [COMPANY_WEBSITE]     — e.g. https://jalimcorp.com
         [VCF_FILENAME]        — e.g. jane-smith.vcf
    ──────────────────────────────────────────────────────────────────────── */
    function downloadVCard() {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:[EMPLOYEE_FULL_NAME]',
        'ORG:[COMPANY_NAME]',
        'TEL;TYPE=CELL:[PHONE_NUMBER]',
        'EMAIL;TYPE=INTERNET:[EMAIL_ADDRESS]',
        'URL:[COMPANY_WEBSITE]',
        'END:VCARD'
      ].join('\r\n');

      var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      var url  = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href     = url;
      link.download = '[VCF_FILENAME]';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
